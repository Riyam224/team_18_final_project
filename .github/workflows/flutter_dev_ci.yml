name: Flutter CI + Firebase Distribution (Android Debug)

on:
  push:
    branches:
      - feature/ci_cd_setup_v3
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Auto-increment version number
        run: |
          VERSION_NAME="1.0.0"
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          echo "Updating pubspec.yaml to version: $VERSION_NAME+$BUILD_NUMBER"

          sed -i '' "s/^version: .*/version: $VERSION_NAME+$BUILD_NUMBER/" pubspec.yaml

          echo "Updated pubspec.yaml:"
          cat pubspec.yaml

      - name: Run Tests with Coverage
        run: flutter test --coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Install Firebase CLI
        run: curl -sL https://firebase.tools | bash

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-debug.apk \
            --app "1:1007099232554:android:abd7cba411c33721a01e53" \
            --groups "testers" \
            --release-notes "Automated Debug Build #${GITHUB_RUN_NUMBER} from GitHub Actions"
