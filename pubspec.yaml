name: team_18_final_project
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.0

  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  cloud_firestore: ^6.1.0
  connectivity_plus: ^7.0.0
  cryptography: ^2.7.0
  dartz: ^0.10.1
  device_info_plus: ^12.2.0
  dio: ^5.9.0
  encrypt: ^5.0.3
  equatable: ^2.0.7
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  firebase_storage: ^13.0.4
  fl_chart: ^1.1.1
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.1
  flutter_session_manager: ^1.0.3
  flutter_svg: ^2.2.1
  formz: ^0.7.0
  get_it: ^8.2.0
  go_router: ^16.2.4
  image_picker: ^1.2.1
  json_annotation: ^4.9.0
  lifecycle: ^0.10.0
  local_auth: ^3.0.0
  provider: ^6.1.2
  retrofit: ^4.7.3
  safe_device: ^1.3.8
  secure_application: ^4.1.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  json_serializable: ^6.11.1
  mocktail: ^1.0.4
  retrofit_generator: ^10.0.6

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Thin.ttf
          weight: 100
        - asset: assets/fonts/Lato-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Lato-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Lato-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
        - asset: assets/fonts/Lato-BlackItalic.ttf
          weight: 900
          style: italic
